  "file-type@>=20.0.0 <21.0.0": ">=21.3.2 <22.0.0"

# Local fixes for advisories with no usable upstream release. Each patch file
# says what it changes; drop the entry once the dependency ships the fix.
patchedDependencies:
  deepmerge@4.3.1: patches/deepmerge@4.3.1.patch
  glob@13.0.6: patches/glob@13.0.6.patch

publicHoistPattern:
  - "@ianvs/prettier-plugin-sort-imports"
  - prettier-plugin-tailwindcss
