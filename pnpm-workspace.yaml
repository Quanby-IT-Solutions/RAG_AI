packages:
  - apps/*
  - packages/*
  - tooling/*

catalog:
  # The Better Auth CLI (`pnpm auth:generate`). Keep it on the same version as better-auth.
  auth: 1.7.15
  "@eslint/js": ^9.39.2
  "@nestjs/common": ^11.2.7
  "@nestjs/core": ^11.2.7
  "@orpc/contract": ^1.13.4
  "@orpc/nest": ^1.13.4
  "@sentry/nestjs": ^10.70.0
  "@sentry/nextjs": 10.75.2
  "@tailwindcss/postcss": ^4.3.3
  "@tanstack/eslint-plugin-query": ^5.91.2
  "@tanstack/react-form": ^1.27.7
  "@tanstack/react-query": ^5.90.16
  "@t3-oss/env-core": ^0.13.10
  "@t3-oss/env-nextjs": ^0.13.10
  "@turbo/gen": ^2.11.9
  "@types/node": ^22.19.3
  "@types/pg": ^8.16.0
  "@types/react": 19.2.7
  "@types/react-dom": 19.2.3
  better-auth: 1.7.15
  dotenv: ^16.6.1
  drizzle-orm: 1.0.0-beta.20
  eslint: ^9.39.2
  nestjs-zod: ^5.1.1
  next: 16.4.1
  pg: ^8.16.3
  prettier: ^3.7.4
  react: 19.2.3
  react-dom: 19.2.3
  tailwindcss: ^4.3.3
  tsx: ^4.21.0
  turbo: ^2.11.9
  typescript: ^5.9.3
  typescript-eslint: ^8.52.0
  zod: 4.6.6

catalogs:
  react19:
    "@types/react": ^19.2.7
    "@types/react-dom": ^19.2.3
    react: 19.2.3
    react-dom: 19.2.3

linkWorkspacePackages: true

onlyBuiltDependencies:
  - "@nestjs/core"
  - "@scarf/scarf"
  - "@swc/core"
  - argon2
  - better-sqlite3
  - core-js-pure
  - esbuild
  - grpc-tools
  - sharp
  - unrs-resolver

overrides:
  "@types/minimatch": 5.1.2
  "@types/mssql": "-"
  "@types/react": 19.2.7
  "@types/react-dom": 19.2.3
  "argparse@>=1 <2>sprintf-js": "-"
  "gel": "-"
  "@graphql-tools/utils@<12.0.1": ">=12.0.1 <13"
  "handlebars@<4.7.10": ">=4.7.10 <5"
  "mssql": "-"
  "proxy-addr@<2.0.8": ">=2.0.8 <3"
  "picomatch@>=4 <4.0.4": ">=4.0.4 <5"
  "ajv@>=8 <8.18.0": ">=8.18.0 <9"
  "lodash@>=4 <4.18.0": ">=4.18.0 <5"
  "js-yaml@>=5 <5.4.1": ">=5.4.1 <5.5.0"
  "http-cache-semantics@<4.3.0": ">=4.3.0 <5"
  # No @nestjs/platform-express release depends on multer >=2.5.0 (11.2.8 and
  # 12.2.0 both pin 2.4.0). Express 5.3.0 still accepts body-parser ^2.3.0, so
  # a parent bump does not force both floors.
  "body-parser@<2.4.0": ">=2.4.0 <3"
  "multer@<2.5.0": ">=2.5.0 <3"
  # @serwist/build and @serwist/turbopack 9.5.13 (latest) depend on zod 4.6.5.
  # @better-auth/core and eslint-plugin-react-hooks accept zod 4.x below 4.6.6,
  # and no current parent release raises that floor. Replaces drizzle-orm>zod 4.3.5.
  "zod@>=4.0.0 <4.6.6": "4.6.6"
  # The override below replaces @next/eslint-plugin-next's fast-glob with
  # tinyglobby. While it is in place, settings.next.rootDir must be a wildcard
  # pattern (e.g. "apps/*/"): a literal path makes the replacement scan the
  # whole tree. Remove this override once @next/eslint-plugin-next stops
  # pinning fast-glob 3.3.1, or when upstream ships a fix, and re-run lint
  # after removing it.
  "@next/eslint-plugin-next>fast-glob": "npm:tinyglobby@^0.2.15"
  # Dependabot/pnpm-audit security backlog — transitive advisory bumps.
  # One entry per (package, major): the fix stays inside the installed major so a
  # vulnerable transitive is patched in place, never force-jumped to a new major.
  "@humanfs/node@>=0.16.0 <0.16.8": ">=0.16.8 <0.17.0"
  "@isaacs/brace-expansion@>=5.0.0 <5.0.1": ">=5.0.1 <6.0.0"
  "@nestjs/microservices@>=11.0.0 <11.2.5": ">=11.2.5 <12.0.0"
  "@orpc/client@>=1.0.0 <1.13.6": ">=1.13.6 <2.0.0"
  "@orpc/openapi@>=1.0.0 <1.13.9": ">=1.13.9 <2.0.0"
  "@orpc/server@>=1.0.0 <1.14.8": ">=1.14.8 <2.0.0"
  "@orpc/zod@>=1.0.0 <1.14.10": ">=1.14.10 <2.0.0"
  "@vitest/mocker@>=4.0.0 <4.1.12": ">=4.1.12 <5.0.0"
  "@xhmikosr/decompress@>=10.0.0 <10.2.2": ">=10.2.2 <11.0.0"
  "ajv@>=6.0.0 <6.14.0": ">=6.14.0 <7.0.0"
  "baseline-browser-mapping@>=2.0.0 <2.11.0": ">=2.11.0 <3.0.0"
  "brace-expansion@>=1.0.0 <1.1.21": ">=1.1.21 <2.0.0"
  "brace-expansion@>=2.0.0 <2.1.7": ">=2.1.7 <3.0.0"
  "brace-expansion@>=5.0.0 <5.0.12": ">=5.0.12 <6.0.0"
  "browserslist@>=4.0.0 <4.28.7": ">=4.28.7 <5.0.0"
  "defu@>=6.0.0 <6.1.5": ">=6.1.5 <7.0.0"
  "fast-copy@>=4.0.0 <4.1.0": ">=4.1.0 <5.0.0"
  "fast-uri@>=3.0.0 <3.1.9": ">=3.1.9 <4.0.0"
  "fflate@>=0.8.0 <0.8.3": ">=0.8.3 <0.9.0"
  "file-type@>=21.0.0 <21.3.2": ">=21.3.2 <22.0.0"
  "form-data@>=4.0.0 <4.0.6": ">=4.0.6 <5.0.0"
